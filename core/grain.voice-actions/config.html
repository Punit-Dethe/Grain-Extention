<!-- Voice Actions — the custom settings card (SPEC §4.1 Level 3). Runs in a
     sandboxed iframe; `window.grain` (injected by the host) is the only channel
     out, and every call is capability-checked in Rust. Stores its rules under
     the extension's own `actions` setting, the shape main.js reads:
       [{ trigger, websites:[{url}], apps:[{path}], enabled }]  -->
<meta charset="utf-8" />
<style>
  /* Grain hands its LIVE palette in as `--grain-*` (the panel bridge reads the
     app's own computed tokens), so this card is drawn with the same surfaces,
     ink and accent as every native row around it, in whichever theme Grain is
     in. The literals are the fallback for a card opened outside Grain.

     The card SURFACE is the sunken beige Grain uses for settings wells, and its
     fields sit on that same surface, told apart by their border. A raised white
     panel with darker inputs inside inverted the page's own depth: in Grain the
     recessed well is where controls live, and the card is a well. */
  :root {
    --paper: var(--grain-paper, #ece5da);
    --sunken: var(--grain-paper-sunken, #ddd5c8);
    --raised: var(--grain-paper-sunken, #ddd5c8);
    --line: var(--grain-line, rgba(20, 19, 18, 0.08));
    --ink: var(--grain-ink, #141312);
    --soft: var(--grain-ink-soft, #807c76);
    --faint: var(--grain-ink-faint, #a09b94);
    --accent: var(--grain-accent, #ff5d1e);
    --accent-ink: #ffffff;
    --danger: #b4462f;
  }
  /* Standalone fallback only — inside Grain every value above already resolves
     to the host's, and the host rewrites this query to follow Grain's theme
     rather than the OS. */
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: var(--grain-paper, #181716);
      --sunken: var(--grain-paper-sunken, #121110);
      --raised: var(--grain-paper-sunken, #121110);
      --line: var(--grain-line, rgba(236, 229, 218, 0.08));
      --ink: var(--grain-ink, #ece5da);
      --soft: var(--grain-ink-soft, #9e9587);
      --faint: var(--grain-ink-faint, #6b6358);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 13px/1.45 -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--ink); background: transparent;
  }
  .card { background: var(--raised); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .head { padding: 14px 16px 10px; }
  .title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .sub { color: var(--soft); font-size: 12px; margin-top: 3px; }
  .body { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  label.fl { display: block; font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--soft); margin-bottom: 6px; }
  input.txt {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--sunken); color: var(--ink); font: inherit; outline: none;
  }
  input.txt:focus { border-color: var(--accent); }
  .target { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 9px; background: var(--sunken); overflow: hidden; }
  .target:focus-within { border-color: var(--accent); }
  .seg { display: flex; border-right: 1px solid var(--line); }
  .seg button {
    display: flex; align-items: center; gap: 4px; padding: 0 10px; font: inherit; font-size: 12px;
    border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--soft); cursor: pointer;
  }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .target input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; padding: 8px 10px; outline: none; }
  .tools { display: flex; align-items: center; gap: 2px; padding-right: 4px; }
  .ic { border: 0; background: transparent; color: var(--soft); cursor: pointer; padding: 6px; border-radius: 7px; display: inline-flex; line-height: 0; }
  .ic:hover { color: var(--accent); background: rgba(216,164,60,.12); }
  .ic.count { color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 600; width: 28px; justify-content: center; }
  .add { width: 100%; padding: 7px; border: 1px dashed var(--line); border-radius: 9px; background: transparent; color: var(--soft); font: inherit; font-size: 12px; cursor: pointer; }
  .add:hover { color: var(--ink); border-color: var(--accent); }
  .row-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn { padding: 7px 13px; border-radius: 9px; border: 1px solid var(--line); background: var(--sunken); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; }
  .btn:hover { border-color: var(--faint); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .list { border-top: 1px solid var(--line); }
  .empty { padding: 22px 16px; text-align: center; color: var(--faint); font-size: 12px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item.off { opacity: .5; }
  .chip { background: var(--sunken); border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .arrow { color: var(--faint); }
  .tgts { display: flex; gap: 6px; min-width: 0; overflow: hidden; flex: 1; }
  .tgt { display: inline-flex; align-items: center; gap: 4px; max-width: 190px; font-size: 11.5px; color: var(--soft); background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  .tgt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sw { width: 32px; height: 18px; border-radius: 999px; background: #0a0a0a; border: 0; position: relative; cursor: pointer; flex: none; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #f0ebe3; transition: transform .18s; }
  .sw.on { background: var(--accent); }
  .sw.on::after { transform: translateX(14px); }
  .err { margin: 0 16px; padding: 7px 10px; border-radius: 8px; background: rgba(180,70,47,.12); color: var(--danger); font-size: 12px; }
  svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>

<div class="card">
  <div class="head">
    <div class="title">Actions</div>
    <div class="sub">Say a phrase to open apps and websites — one action can open several at once. Fully local; the trigger is removed from what gets typed.</div>
  </div>
  <div id="err" class="err" style="display:none"></div>
  <div class="body">
    <div>
      <label class="fl" for="trigger">Trigger phrase</label>
      <input id="trigger" class="txt" type="text" maxlength="100" placeholder="e.g. start coding, open email" />
    </div>
    <div>
      <label class="fl">Opens</label>
      <div id="targets" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="add" id="add-target" style="margin-top:8px">+ Add target</button>
    </div>
    <div class="row-actions">
      <button class="btn" id="test">▶ Test</button>
      <button class="btn" id="cancel" style="display:none">Cancel</button>
      <button class="btn primary" id="submit">Add action</button>
    </div>
  </div>
  <div id="list" class="list"></div>
</div>

<script>
(function () {
  var g = window.grain;
  var ICON = {
    app: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>',
    web: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>',
    cross: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    folder: '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    crosshair: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
    pencil: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2 2 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    trash: '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>'
  };
  var state = { editing: null, trigger: "", targets: [{ kind: "app", value: "" }], actions: [], capturing: null };
  var $ = function (id) { return document.getElementById(id); };

  function showErr(msg) { var e = $("err"); if (!msg) { e.style.display = "none"; return; } e.textContent = msg; e.style.display = "block"; }

  // Storage shape (what main.js reads): { trigger, websites:[{url}], apps:[{path}], enabled }.
  function toStored(trigger, targets, enabled) {
    var websites = [], apps = [];
    targets.forEach(function (t) {
      var v = (t.value || "").trim(); if (!v) return;
      if (t.kind === "url") websites.push({ url: v }); else apps.push({ path: v });
    });
    return { trigger: trigger, websites: websites, apps: apps, enabled: enabled !== false };
  }
  function toTargets(a) {
    var out = [];
    (a.apps || []).forEach(function (p) { if (p && p.path) out.push({ kind: "app", value: p.path }); });
    (a.websites || []).forEach(function (w) { if (w && w.url) out.push({ kind: "url", value: w.url }); });
    return out.length ? out : [{ kind: "app", value: "" }];
  }
  function chips(a) { return toTargets(a).filter(function (t) { return t.value; }); }

  function load() {
    g.settings.get("actions").then(function (v) {
      state.actions = Array.isArray(v) ? v : [];
      renderList();
    }).catch(function (e) { showErr(String(e && e.message || e)); });
  }
  function persist(next) {
    state.actions = next;
    renderList();
    g.settings.set("actions", next).catch(function (e) { showErr(String(e && e.message || e)); load(); });
  }

  function renderTargets() {
    var box = $("targets"); box.innerHTML = "";
    state.targets.forEach(function (t, i) {
      var row = document.createElement("div"); row.className = "target";
      var cap = state.capturing && state.capturing.i === i;
      row.innerHTML =
        '<div class="seg">' +
          '<button data-k="app" class="' + (t.kind === "app" ? "on" : "") + '">' + ICON.app + ' App</button>' +
          '<button data-k="url" class="' + (t.kind === "url" ? "on" : "") + '">' + ICON.web + ' Web</button>' +
        '</div>' +
        '<input type="text" value="' + esc(t.value) + '" placeholder="' + (t.kind === "app" ? "App path, e.g. C:\\\\…\\\\Code.exe" : "Website, e.g. github.com") + '" />' +
        '<div class="tools">' +
          (cap ? '<span class="ic count">' + state.capturing.n + '</span>'
               : '<button class="ic" data-a="capture" title="Capture focused app">' + ICON.crosshair + '</button>') +
          (t.kind === "app" ? '<button class="ic" data-a="browse" title="Browse for an app">' + ICON.folder + '</button>' : '') +
          '<button class="ic" data-a="remove" title="Remove">' + ICON.cross + '</button>' +
        '</div>';
      row.querySelectorAll(".seg button").forEach(function (b) {
        b.onclick = function () { state.targets[i].kind = b.getAttribute("data-k"); renderTargets(); };
      });
      row.querySelector("input").oninput = function (e) { state.targets[i].value = e.target.value; };
      row.querySelectorAll("[data-a]").forEach(function (b) {
        var a = b.getAttribute("data-a");
        b.onclick = function () {
          if (a === "remove") { state.targets.splice(i, 1); if (!state.targets.length) state.targets.push({ kind: "app", value: "" }); renderTargets(); }
          else if (a === "browse") browse(i);
          else if (a === "capture") capture(i);
        };
      });
      box.appendChild(row);
    });
  }

  function browse(i) {
    g.open.pickApp().then(function (p) { if (p) { state.targets[i].value = p; renderTargets(); } })
      .catch(function (e) { showErr(String(e && e.message || e)); });
  }
  function capture(i) {
    if (state.capturing) return;
    var n = 3; state.capturing = { i: i, n: n }; renderTargets();
    var tick = setInterval(function () {
      n -= 1;
      if (n > 0) { state.capturing = { i: i, n: n }; renderTargets(); return; }
      clearInterval(tick); state.capturing = null;
      g.focusedApp().then(function (app) {
        if (!app) { showErr("Couldn't detect the focused app. Try again."); renderTargets(); return; }
        if (app.urlHost) state.targets[i] = { kind: "url", value: app.urlHost };
        else if (app.exePath) state.targets[i] = { kind: "app", value: app.exePath };
        else showErr("Couldn't resolve a launchable path for " + (app.name || app.exe || "that app") + ".");
        renderTargets();
      }).catch(function (e) { showErr(String(e && e.message || e)); renderTargets(); });
    }, 1000);
  }

  function test() {
    showErr("");
    state.targets.forEach(function (t) {
      var v = (t.value || "").trim(); if (!v) return;
      if (t.kind === "url") g.open.url(v); else g.open.app(v);
    });
  }

  function submit() {
    showErr("");
    var trig = $("trigger").value.trim();
    if (!trig) { showErr("Enter a trigger phrase."); return; }
    var hasTarget = state.targets.some(function (t) { return (t.value || "").trim(); });
    if (!hasTarget) { showErr("Add at least one app or website."); return; }
    var norm = trig.toLowerCase().replace(/[^a-z0-9]/g, "");
    var clash = state.actions.some(function (a, idx) {
      return idx !== state.editing && (a.trigger || "").toLowerCase().replace(/[^a-z0-9]/g, "") === norm;
    });
    if (clash) { showErr('"' + trig + '" already uses that trigger.'); return; }
    var enabled = state.editing != null ? (state.actions[state.editing].enabled !== false) : true;
    var stored = toStored(trig, state.targets, enabled);
    var next = state.actions.slice();
    if (state.editing != null) next[state.editing] = stored; else next.push(stored);
    resetForm();
    persist(next);
  }
  function resetForm() {
    state.editing = null; state.trigger = ""; state.targets = [{ kind: "app", value: "" }];
    $("trigger").value = ""; $("cancel").style.display = "none"; $("submit").textContent = "Add action";
    renderTargets();
  }
  function edit(i) {
    var a = state.actions[i];
    state.editing = i; state.targets = toTargets(a);
    $("trigger").value = a.trigger || ""; $("cancel").style.display = "";
    $("submit").textContent = "Update action"; renderTargets();
    showErr("");
  }

  function renderList() {
    var box = $("list");
    if (!state.actions.length) { box.innerHTML = '<div class="empty">No actions yet. Add one above to open apps or sites with your voice.</div>'; return; }
    box.innerHTML = "";
    state.actions.forEach(function (a, i) {
      var on = a.enabled !== false;
      var item = document.createElement("div"); item.className = "item" + (on ? "" : " off");
      var tg = chips(a).map(function (t) {
        return '<span class="tgt">' + (t.kind === "app" ? ICON.app : ICON.web) + '<span>' + esc(t.value) + '</span></span>';
      }).join("");
      item.innerHTML =
        '<span class="chip">' + esc(a.trigger || "") + '</span>' +
        '<span class="arrow">→</span>' +
        '<div class="tgts">' + tg + '</div>' +
        '<button class="ic" data-a="run" title="Run now">' + ICON.play + '</button>' +
        '<button class="sw ' + (on ? "on" : "") + '" data-a="toggle" title="Enable / disable"></button>' +
        '<button class="ic" data-a="edit" title="Edit">' + ICON.pencil + '</button>' +
        '<button class="ic" data-a="del" title="Delete">' + ICON.trash + '</button>';
      item.querySelectorAll("[data-a]").forEach(function (b) {
        var act = b.getAttribute("data-a");
        b.onclick = function () {
          if (act === "run") { chips(a).forEach(function (t) { if (t.kind === "url") g.open.url(t.value); else g.open.app(t.value); }); }
          else if (act === "toggle") { var n = state.actions.slice(); n[i] = Object.assign({}, a, { enabled: !on }); persist(n); }
          else if (act === "edit") edit(i);
          else if (act === "del") { if (state.editing === i) resetForm(); var n = state.actions.slice(); n.splice(i, 1); persist(n); }
        };
      });
      box.appendChild(item);
    });
  }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }

  $("add-target").onclick = function () { state.targets.push({ kind: "app", value: "" }); renderTargets(); };
  $("test").onclick = test;
  $("submit").onclick = submit;
  $("cancel").onclick = resetForm;

  renderTargets();
  load();
})();
</script>
