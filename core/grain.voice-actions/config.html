<!doctype html>
<meta charset="utf-8" />
<style>
  body { font: 14px system-ui, sans-serif; padding: 18px; background: #f7f4ee; color: #211f1b; }
  h2 { margin: 0 0 4px; }
  p { color: #6b6862; margin: 0 0 14px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  input { padding: 7px 9px; border: 1px solid #d9d3c7; border-radius: 8px; flex: 1; min-width: 140px; }
  button { padding: 7px 12px; border: 1px solid #d9d3c7; border-radius: 8px; background: #fff; cursor: pointer; }
  button:hover { border-color: #b7afa0; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #eee6d8; border-radius: 8px; margin-bottom: 6px; }
  li .t { font-weight: 600; }
  li .g { color: #6b6862; flex: 1; word-break: break-all; }
  .kind { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #eee6d8; color: #6b6862; }
</style>
<main>
  <h2>Voice Actions</h2>
  <p>Say a trigger and Grain opens the target, then removes the trigger from your text.</p>
  <div class="row">
    <input id="trig" placeholder="trigger — e.g. open docs" />
    <input id="url" placeholder="https://example.com" />
    <button id="add-url">Add link</button>
    <button id="add-app">Add app…</button>
  </div>
  <ul id="list"></ul>
</main>
<script>
  function load() {
    return grain.storage.get("rules").then(function (r) { return Array.isArray(r) ? r : []; });
  }
  function save(rules) { return grain.storage.set("rules", rules).then(render); }
  function render() {
    load().then(function (rules) {
      var ul = document.getElementById("list");
      ul.innerHTML = "";
      rules.forEach(function (r, i) {
        var li = document.createElement("li");
        var kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = r.kind === "app" ? "app" : "link";
        var t = document.createElement("span");
        t.className = "t";
        t.textContent = r.trigger;
        var g = document.createElement("span");
        g.className = "g";
        g.textContent = r.target;
        var rm = document.createElement("button");
        rm.textContent = "Remove";
        rm.onclick = function () { rules.splice(i, 1); save(rules); };
        li.appendChild(kind); li.appendChild(t); li.appendChild(g); li.appendChild(rm);
        ul.appendChild(li);
      });
    });
  }
  document.getElementById("add-url").onclick = function () {
    var t = document.getElementById("trig").value.trim();
    var u = document.getElementById("url").value.trim();
    if (!t || !u) return;
    load().then(function (rules) {
      rules.push({ trigger: t, kind: "url", target: u });
      save(rules);
      document.getElementById("trig").value = "";
      document.getElementById("url").value = "";
    });
  };
  document.getElementById("add-app").onclick = function () {
    var t = document.getElementById("trig").value.trim();
    if (!t) { alert("Enter a trigger word first."); return; }
    // The host opens the native chooser and records the picked app as approved
    // for this extension — the only way open.app can later launch it.
    grain.open.pickApp().then(function (path) {
      if (!path) return;
      load().then(function (rules) {
        rules.push({ trigger: t, kind: "app", target: path });
        save(rules);
        document.getElementById("trig").value = "";
      });
    });
  };
  render();
</script>
