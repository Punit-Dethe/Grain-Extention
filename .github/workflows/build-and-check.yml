# Manual review lane; no privileged attestation against a fork PR checkout.
# Reuse the isolated builder; no signing key or publication permission.
name: build-and-check
on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Reviewed extensions/<id> submission on this trusted registry branch
        type: string
        required: true
permissions: {}
jobs:
  candidate:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-source-candidate.yml
    with:
      submission_id: ${{ inputs.submission_id }}
